name: Build VoiceInk (local ad-hoc)

# Builds an ad-hoc–signed VoiceInk.app via `make local` (no Apple Developer
# account needed) and uploads it as an artifact. Runs on pushes to the
# soniox-eu branch and can be triggered manually.

on:
  push:
    branches: [soniox-eu]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Ensure cmake (whisper.cpp xcframework build)
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Build (make local)
        run: make local

      - name: Package app bundle
        run: |
          APP="$HOME/Downloads/VoiceInk.app"
          test -d "$APP" || { echo "VoiceInk.app not found at $APP"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" VoiceInk-EU.zip
          ls -lh VoiceInk-EU.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-EU-app
          path: VoiceInk-EU.zip
          if-no-files-found: error
